[package]
name = "polyfont-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for polyfont configuration and font management"
repository.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["cli", "font", "polyfont", "terminal", "code-editor"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "polyfont"
path = "src/main.rs"

[dependencies]
polyfont-core = { workspace = true }
polyfont-config = { workspace = true }
polyfont-scope = { workspace = true }
polyfont-fonts = { workspace = true, features = ["download"] }
polyfont-themes = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
download = ["polyfont-fonts/download"]
