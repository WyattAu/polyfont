[package]
name = "polyfont-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for polyfont multi-font configuration"
repository.workspace = true
readme = "README.md"
keywords = ["font", "syntax-highlighting", "textmate", "editor"]
categories = ["text-editors", "development-tools"]

[[bin]]
name = "polyfont"
path = "src/main.rs"

[dependencies]
polyfont-core = { path = "../polyfont-core" }
polyfont-config = { path = "../polyfont-config" }
polyfont-scope = { path = "../polyfont-scope" }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
