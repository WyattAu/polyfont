[package]
name = "polyfont-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["font", "rendering", "gpu", "text", "compositing"]
categories = ["text-editors", "graphics", "rendering"]
description = "Custom multi-font rendering engine for polyfont"

[features]
default = []
# Enable GPU-accelerated rendering via wgpu (requires wgpu, glyphon, cosmic-text)
gpu = []
# Enable software rendering fallback (requires softbuffer, tiny-skia, fontdb)
software = []

[dependencies]
polyfont-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
