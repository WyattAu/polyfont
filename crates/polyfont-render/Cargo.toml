[package]
name = "polyfont-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["render", "font", "text-rendering", "atlas", "glyph"]
categories = ["rendering", "text-processing"]
description = "Software rendering engine for per-token font output"
documentation.workspace = true

[features]
default = []
software = ["fontdb", "tiny-skia"]
gpu = []

[dependencies]
polyfont-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
fontdb = { version = "0.23", optional = true }
tiny-skia = { version = "0.11", optional = true }

[dev-dependencies]
polyfont-scope.workspace = true
tempfile = "3"
