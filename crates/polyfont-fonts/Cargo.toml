[package]
name = "polyfont-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["font", "system-fonts", "font-discovery"]
categories = ["text-editors", "development-tools"]
description = "Cross-platform font discovery and management for polyfont"

[features]
default = []
download = ["reqwest", "sha2", "zip"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "0.8"

[dependencies.reqwest]
version = "0.12"
features = ["rustls-tls", "blocking"]
optional = true

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.zip]
version = "2"
optional = true
